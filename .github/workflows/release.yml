name: desktop-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  unsigned-desktop-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - run: npm run audit:public
      - run: npm run desktop:dist
      - run: npm run desktop:test-package
      - name: Mark artifact as unsigned test output
        shell: pwsh
        run: |
          "## TEST ONLY - UNSIGNED" >> $env:GITHUB_STEP_SUMMARY
          "These files are not a stable release or updater feed." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-desktop-test
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  signed-tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Require signing identity before build
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          DESKTOP_PUBLISHER_SUBJECT: ${{ vars.DESKTOP_PUBLISHER_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "CSC_LINK is required for a signed tag release"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "CSC_KEY_PASSWORD is required for a signed tag release"
          }
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_PUBLISHER_SUBJECT)) {
            throw "DESKTOP_PUBLISHER_SUBJECT repository variable is required"
          }
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - run: npm run audit:public
      - run: npm run audit:release
      - name: Match tag and workspace versions
        id: release_meta
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $webVersion = (Get-Content apps/web/package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $rootVersion -or $tagVersion -ne $webVersion -or $tagVersion -ne $desktopVersion) {
            throw "tag, root, web, and desktop versions must match"
          }
          $isPrerelease = $tagVersion -match '-'
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build signed desktop artifacts
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          DESKTOP_PUBLISHER_SUBJECT: ${{ vars.DESKTOP_PUBLISHER_SUBJECT }}
        run: |
          npx electron-builder --projectDir apps/desktop --win --publish never `
            -c.win.publisherName="$env:DESKTOP_PUBLISHER_SUBJECT"
      - run: npm run desktop:test-package
      - name: Verify Authenticode and update metadata
        shell: pwsh
        env:
          DESKTOP_PUBLISHER_SUBJECT: ${{ vars.DESKTOP_PUBLISHER_SUBJECT }}
        run: |
          $executables = @(Get-ChildItem apps/desktop/dist/*.exe)
          if ($executables.Count -ne 2) {
            throw "expected exactly the NSIS and portable executables"
          }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($executable.Name) has invalid Authenticode status: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -ne $env:DESKTOP_PUBLISHER_SUBJECT) {
              throw "$($executable.Name) signer does not match DESKTOP_PUBLISHER_SUBJECT"
            }
          }

          $metadataPath = "apps/desktop/dist/latest.yml"
          if (-not (Test-Path -LiteralPath $metadataPath)) {
            throw "latest.yml is missing"
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw
          $fileEntries = [regex]::Matches(
            $metadata,
            '(?m)^\s*-\s+url:\s*(?<url>[^\r\n]+)\r?\n\s+sha512:\s*(?<sha>[A-Za-z0-9+/=]{40,})\s*$'
          )
          if ($fileEntries.Count -lt 1) {
            throw "latest.yml has no file entry with a non-empty SHA-512"
          }
          foreach ($entry in $fileEntries) {
            $artifactName = [Uri]::UnescapeDataString(
              $entry.Groups["url"].Value.Trim().Trim('"', "'")
            )
            $artifactPath = Join-Path "apps/desktop/dist" $artifactName
            if (-not (Test-Path -LiteralPath $artifactPath)) {
              throw "latest.yml references a missing artifact: $artifactName"
            }
          }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
